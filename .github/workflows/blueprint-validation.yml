name: Blueprint validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Blueprint publication boundary and architecture source
        run: bash tooling/scripts/validate-blueprint.sh
